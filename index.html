<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="伞下江南 · 西湖绸伞数字共创。">
  <title>伞下江南 | Jiangnan Beneath the Umbrella</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css?v=20261027-uiverse-webawesome-v21">
</head>
<body>
  <canvas id="inkWashBackground" class="ink-wash-background" aria-hidden="true"></canvas>
  <div class="paper-grain" aria-hidden="true"></div>
  <svg class="ambient-landscape" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="farLakeMountain" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#80948D" stop-opacity=".24" />
        <stop offset="1" stop-color="#80948D" stop-opacity=".09" />
      </linearGradient>
      <linearGradient id="nearLakeMountain" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#777A75" stop-opacity=".18" />
        <stop offset="1" stop-color="#80948D" stop-opacity=".06" />
      </linearGradient>
      <linearGradient id="lakeMist" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#F5F1E8" stop-opacity="0" />
        <stop offset=".24" stop-color="#80948D" stop-opacity=".2" />
        <stop offset=".72" stop-color="#F5F1E8" stop-opacity=".13" />
        <stop offset="1" stop-color="#F5F1E8" stop-opacity="0" />
      </linearGradient>
      <filter id="softLakeEdge" x="-5%" y="-20%" width="110%" height="140%">
        <feGaussianBlur stdDeviation="5.2" />
      </filter>
      <filter id="softLakeMist" x="-10%" y="-60%" width="120%" height="220%">
        <feGaussianBlur stdDeviation="20" />
      </filter>
      <filter id="lakeWave" x="-3%" y="-30%" width="106%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.022" numOctaves="1" seed="4" result="waveNoise">
          <animate attributeName="baseFrequency" values="0.006 0.022;0.009 0.032;0.006 0.022" dur="9s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="waveNoise" scale="6.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
    <g class="landscape-far">
      <path d="M-40 449 C38 444 79 415 132 397 C190 377 229 388 268 415 C303 439 333 440 370 425 C411 409 431 373 474 364 C518 354 555 370 580 400 C607 432 643 438 685 422 C727 406 749 386 786 386 C822 386 848 404 878 421 C913 441 951 440 990 422 C1036 402 1068 373 1115 367 C1164 360 1195 378 1225 404 C1261 436 1291 442 1332 426 C1372 410 1405 388 1445 389 C1492 390 1527 420 1570 431 C1601 439 1624 438 1640 436 L1640 900 L-40 900 Z" fill="url(#farLakeMountain)" filter="url(#softLakeEdge)" />
      <path d="M-20 458 C102 432 128 405 205 402 C274 400 319 439 389 438 C474 437 499 389 560 383 C641 375 668 426 748 430 C826 434 857 404 920 400 C997 396 1036 435 1110 436 C1193 437 1230 391 1305 389 C1387 387 1424 428 1501 437 C1542 442 1584 440 1620 436" fill="none" stroke="#80948D" stroke-opacity=".24" stroke-width="2" filter="url(#lakeWave)" />
    </g>
    <g class="landscape-near">
      <path d="M-40 526 C42 519 91 493 145 480 C208 464 254 478 291 506 C332 537 366 543 411 526 C459 508 491 470 542 461 C592 452 627 465 658 491 C695 522 732 538 776 528 C820 518 847 490 887 482 C938 471 980 483 1014 510 C1051 539 1090 546 1135 530 C1188 512 1217 480 1267 477 C1320 474 1358 494 1390 518 C1428 546 1465 549 1510 533 C1557 517 1590 513 1640 519 L1640 900 L-40 900 Z" fill="url(#nearLakeMountain)" filter="url(#softLakeEdge)" />
      <path d="M20 537 C140 520 177 492 239 492 C306 492 333 529 396 536 C474 545 507 490 570 481 C647 471 678 515 751 526 C825 538 860 500 930 495 C1006 489 1047 527 1120 537 C1192 546 1231 499 1301 492 C1380 484 1417 525 1490 538" fill="none" stroke="#777A75" stroke-opacity=".2" stroke-width="2" filter="url(#lakeWave)" />
    </g>
    <g class="landscape-mist" filter="url(#softLakeMist)">
      <path d="M-30 483 C150 446 267 462 407 480 C563 500 646 478 799 469 C958 459 1070 477 1212 486 C1376 496 1481 465 1630 462 L1630 550 C1453 550 1355 532 1195 539 C1049 545 953 522 799 530 C637 538 545 557 397 538 C245 519 139 524 -30 558 Z" fill="url(#lakeMist)" />
    </g>
  </svg>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">☂</span>
        <div>
          <h1>伞下江南</h1>
          <p>JIANGNAN BENEATH THE UMBRELLA</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="button btn-accent" id="randomBtn" type="button">灵感</button>
        <button class="button btn-secondary" id="templateBtn" type="button">示例</button>
        <button class="button btn-secondary" id="clearBtn" type="button">清空</button>
        <button class="button btn-primary" id="saveBtn" type="button">存入画廊</button>
      </div>
    </header>

    <main class="main-content">
      <section class="canvas-container" aria-label="绸伞创作画布">
        <div class="canvas-stage" id="canvasStage">
          <div class="canvas-artwork-viewport" id="canvasArtworkViewport">
            <canvas id="umbrellaCanvas" width="720" height="720" aria-label="西湖绸伞绘制画布；伞面内绘制，左侧空白拖动旋转，滚轮缩放"></canvas>
            <div class="fluid-host" id="fluidHost" aria-hidden="true"></div>
          </div>
        </div>
        <div class="three-viewer" id="threeViewer" hidden aria-label="西湖绸伞三维预览">
          <div class="scenery-backdrop" aria-hidden="true">
            <span class="scenery-hill scenery-hill-far"></span>
            <span class="scenery-hill scenery-hill-near"></span>
            <span class="scenery-mist"></span>
          </div>
          <div class="viewer-toolbar">
            <button class="viewer-button" id="importModelBtn" type="button">导入 Blender GLB</button>
            <button class="viewer-button" id="resetModelBtn" type="button" hidden>恢复程序伞</button>
            <button class="viewer-button audio-reactive-button" id="audioReactiveBtn" type="button" aria-pressed="false" title="播放或暂停内置江南氛围音乐与声光响应">
              <span class="audio-button-label">声光响应</span>
              <span class="audio-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            </button>
            <input id="umbrellaModelInput" type="file" accept=".glb,model/gltf-binary" hidden>
          </div>
          <div class="three-host" id="threeHost"></div>
          <div class="viewer-fold-control" role="group" aria-label="绸伞开合控制">
            <label for="umbrellaFoldRange">开合</label>
            <input id="umbrellaFoldRange" type="range" min="0" max="100" step="1" value="0" aria-label="伞面收拢程度">
            <output id="umbrellaFoldValue" for="umbrellaFoldRange">展开</output>
            <button class="viewer-button fold-toggle" id="foldToggleBtn" type="button" aria-label="收伞">收伞</button>
          </div>
          <p class="viewer-error" id="threeError" hidden></p>
        </div>
        <div class="canvas-status" aria-live="polite">
          <div class="status-info">
            <span id="patternReadout">西湖荷花</span>
            <span class="status-divider"></span>
            <span>画笔对称：<b id="segmentReadout">8</b></span>
          </div>
          <div class="view-switch" role="group" aria-label="预览模式">
            <button type="button" class="view-button is-active" data-view-mode="2d" aria-pressed="true">2D 绘制</button>
            <button type="button" class="view-button" data-view-mode="3d" aria-pressed="false">3D 赏伞</button>
          </div>
        </div>
      </section>

      <aside class="controls" aria-label="创作工具">
        <section class="control-group mode-group">
          <div class="mode-switch" role="group" aria-label="创作模式">
            <button type="button" class="mode-button is-active" id="brushModeBtn" data-mode="brush">自由绘画</button>
            <button type="button" class="mode-button" id="patternModeBtn" data-mode="pattern">纹样装饰</button>
          </div>
          <div class="mode-utilities">
            <button type="button" class="utility-button" id="undoBtn" aria-label="撤销">↶</button>
            <button type="button" class="utility-button" id="redoBtn" aria-label="重做">↷</button>
            <button type="button" class="utility-button" id="guideToggle" aria-pressed="false">构图辅助</button>
            <label class="check-row snap-control" for="zoneSnap"><input type="checkbox" id="zoneSnap" checked><span>区域吸附</span></label>
          </div>
        </section>

        <section class="control-group brush-group" id="brushTools">
          <h2>笔刷</h2>
          <div class="brush-style-row" role="group" aria-label="笔触风格">
            <button type="button" class="style-chip is-active" data-brush-style="soft">柔墨</button>
            <button type="button" class="style-chip" data-brush-style="texture">纤维笔</button>
            <button type="button" class="style-chip" data-brush-style="clean">清晰</button>
            <button type="button" class="style-chip" data-brush-style="fluid">水墨生成</button>
          </div>
          <div class="swatch-row" role="group" aria-label="笔触颜色">
            <input type="color" id="colorPicker" value="#b96e68" aria-label="自选笔触颜色">
            <button type="button" class="color-swatch is-active" data-brush-color="#b96e68" style="--swatch:var(--color-lotus)" aria-label="荷花红"></button>
            <button type="button" class="color-swatch" data-brush-color="#537c7e" style="--swatch:var(--color-lake)" aria-label="西湖青"></button>
            <button type="button" class="color-swatch" data-brush-color="#bfa37a" style="--swatch:var(--color-bamboo)" aria-label="竹骨金"></button>
            <button type="button" class="color-swatch" data-brush-color="#263f3a" style="--swatch:var(--color-ink)" aria-label="黛青"></button>
            <button type="button" class="color-swatch" data-brush-color="#f1eee5" style="--swatch:var(--color-silk)" aria-label="绸缎米白"></button>
          </div>
          <div class="control-item">
            <label for="brushSize">大小</label>
            <input type="range" id="brushSize" min="4" max="28" step="1" value="8">
            <output class="value-display" id="brushSizeValue">8</output>
          </div>
          <div class="control-item">
            <label for="opacity">浓淡</label>
            <input type="range" id="opacity" min="10" max="100" step="1" value="45">
            <output class="value-display" id="opacityValue">45%</output>
          </div>
        </section>

        <section class="control-group symmetry-group">
          <div class="group-title-row">
            <h2>放射重复</h2>
            <output class="segment-value" id="segmentsValue">8 重</output>
          </div>
          <div class="segment-slider">
            <input type="range" id="segments" min="1" max="14" step="1" value="8" aria-label="放射重复数量">
          </div>
          <div class="control-item compact-item">
            <label class="check-row" for="mirror"><input type="checkbox" id="mirror" checked><span>镜像</span></label>
          </div>
        </section>

        <section class="control-group pattern-group">
          <div class="group-title-row">
            <h2>纹样</h2>
            <div class="carousel-arrows">
              <button type="button" class="carousel-arrow" data-carousel="prev" aria-label="向左浏览纹样">‹</button>
              <button type="button" class="carousel-arrow" data-carousel="next" aria-label="向右浏览纹样">›</button>
            </div>
          </div>
          <div class="pattern-categories" id="patternCategories" role="tablist" aria-label="纹样分类"></div>
          <div class="pattern-carousel" id="patternCarousel" role="listbox" aria-label="选择纹样"></div>
        </section>

        <section class="control-group pattern-edit-group" id="patternTools" hidden>
          <div class="group-title-row"><h2>纹样编辑</h2><button type="button" class="text-button" id="deletePatternBtn">删除选中</button></div>
          <div class="pattern-edit-actions"><button type="button" class="button btn-primary repeat-button" id="repeatBtn">环形重复</button><span class="zone-note" id="selectedZone">伞面区域</span></div>
          <div class="control-item"><label for="repeatCount">重复数</label><input type="range" id="repeatCount" min="2" max="16" step="1" value="8"><output class="value-display" id="repeatCountValue">8</output></div>
          <div class="control-item"><label for="repeatRadius">排列半径</label><input type="range" id="repeatRadius" min="0" max="238" step="1" value="95"><output class="value-display" id="repeatRadiusValue">95px</output></div>
          <div class="control-item"><label for="patternScale">整体大小</label><input type="range" id="patternScale" min="0.06" max="3" step="0.01" value="1"><output class="value-display" id="patternScaleValue">100%</output></div>
          <div class="control-item"><label for="patternRotation">旋转角度</label><input type="range" id="patternRotation" min="-180" max="180" step="1" value="0"><output class="value-display" id="patternRotationValue">0°</output></div>
          <div class="orientation-row" role="group" aria-label="环形纹样朝向">
            <button type="button" class="style-chip" data-orientation="tangent">切线</button>
            <button type="button" class="style-chip" data-orientation="radial">径向</button>
            <button type="button" class="style-chip is-active" data-orientation="original">原朝向</button>
          </div>
        </section>

        <section class="control-group fabric-group">
          <h2>伞面</h2>
          <div class="fabric-settings">
            <div class="swatch-row fabric-swatches" role="group" aria-label="伞面颜色">
              <button type="button" class="fabric-swatch is-active" data-fabric-color="#f1eee5" style="--swatch:var(--color-silk)" aria-label="绸缎米白"></button>
              <button type="button" class="fabric-swatch" data-fabric-color="#d5e5dd" style="--swatch:var(--color-mist)" aria-label="淡湖青"></button>
              <button type="button" class="fabric-swatch" data-fabric-color="#537c7e" style="--swatch:var(--color-lake)" aria-label="西湖青"></button>
              <button type="button" class="fabric-swatch" data-fabric-color="#d7b0a4" style="--swatch:var(--color-lotus-light)" aria-label="荷花粉"></button>
            </div>
            <div class="fabric-style" role="group" aria-label="织物质感">
              <button type="button" class="style-chip is-active" data-fabric-style="silk">素绸</button>
              <button type="button" class="style-chip" data-fabric-style="gauze">轻纱</button>
              <button type="button" class="style-chip" data-fabric-style="indigo">蓝印</button>
            </div>
          </div>
        </section>

        <section class="control-group fluid-debug-group" aria-label="水墨流场调试">
          <div class="group-title-row"><h2>水墨流场</h2><button class="viewer-button fluid-test-button" id="fluidTestBtn" type="button">测试注入</button></div>
          <label class="fluid-debug-label" for="fluidDebugMode">预览</label>
          <select id="fluidDebugMode" class="fluid-debug-select" aria-label="流场调试视图">
            <option value="composite">绸面颜料</option>
            <option value="velocity">速度场</option>
            <option value="dye">颜料密度</option>
            <option value="wetness">湿度场</option>
          </select>
        </section>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js?v=20261027-uiverse-webawesome-v35"></script>
</body>
</html>
